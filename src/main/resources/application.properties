spring.application.name=usuarios

# --- Configuración de conexión a la base de datos (MySQL) ---
# Usando perfil MySQL
spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/JavaM6?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Qwe.123*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# mvn -Pmysql spring-boot:run -Dspring-boot.run.profiles=mysql

# Configuración de Swagger UI / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true

# Puerto del servidor (puedes cambiarlo aquí). También puedes sobrescribirlo con la variable de entorno SERVER_PORT
# Ejemplo: export SERVER_PORT=9090  (o usar -Dserver.port=9090 al ejecutar)
server.port=8082

# ==================== JWT Configuration ====================
# Clave secreta para firmar los tokens JWT (en producción usar variable de entorno)
# IMPORTANTE: Esta clave debe ser de al menos 256 bits (32 caracteres) codificada en Base64
jwt.secret-key=${JWT_SECRET_KEY:dGhpc0lzQVNlY3VyZUtleUZvckpXVFRva2VuU2lnbmluZ1dpdGhIUzI1NkFsZ29yaXRobQ==}

# Tiempo de expiración del access token en milisegundos (15 minutos = 900000)
jwt.expiration=${JWT_EXPIRATION:900000}

# Tiempo de expiración del refresh token en milisegundos (7 días = 604800000)
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

