spring.application.name=CRUD_List

# Deshabilitar JPA ya que usamos arrays en memoria
## Habilitar Auto-configuración de DataSource/JPA para usar MySQL
# Si previamente excluías DataSource (para modo in-memory), quita esa exclusión.
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# --- Configuración de conexión a la base de datos (MySQL) ---
# Ajusta estos valores según tu entorno (usuario/contraseña/nombre de la BD)
## Default: use H2 in-memory so project builds and runs without external DB/driver.
spring.datasource.url=jdbc:h2:mem:crud_list_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate schema behavior for in-memory dev DB
spring.jpa.hibernate.ddl-auto=update

# To use MySQL instead, run the application with Spring profile 'mysql' and activate Maven profile 'mysql'
# Example to run with MySQL (requires internet or installed connector):
# mvn -Pmysql spring-boot:run -Dspring-boot.run.profiles=mysql

# Configuración de Swagger UI / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.use-root-path=true

# Puerto del servidor (puedes cambiarlo aquí). También puedes sobrescribirlo con la variable de entorno SERVER_PORT
# Ejemplo: export SERVER_PORT=9090  (o usar -Dserver.port=9090 al ejecutar)
server.port=8082

